<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Legacy Pensions</title>
    <link rel="icon" href="images/favicon-32x32.png">
    <link rel="stylesheet" href="CSS/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/home.css">
    <link rel="stylesheet" type="text/css" href="CSS/create.css">
    <link rel="stylesheet" href="CSS/font-awesome.min.css">
</head>
<body>

    <header class="header">
            <div class="brand">
                <img src="images/ioj.jpg" alt="logo" id="logo">
                <h2 id="heads">Legacy Pensions 
                <span class="tagline">...securing tomorrow's comfort today</span></h2>
            </div>

                    <!-- Hamburger Toggle -->
                <input type="checkbox" id="menu-toggle">
                <label for="menu-toggle" class="hamburger">&#9776;</label>

            <nav class="navbar">
                <ul>
                    <li>
                        <a href="home.html">Home</a>
                    </li>
                    <li>
                        <a href="#">Contact Us</a>
                    </li>
                </ul>
            </nav>
    </header>

    <main class="register">

        <div class="signup-container"> 

            <h2 style="font-size: 29px;">Welcome Back</h2>
            <p style="text-align: center; font-size: 15px; margin-bottom: 25px; color: gray;">
                Login to your account
            </p>

            <form method="post" action=""> 

                <div class="input-group">
                    <input type="email" placeholder="Email Address" name="email" required>
                </div>

                <div class="input-group">
                    <input type="password" class="form-control" placeholder="Password" name="password" required>
                </div>

                <div class="check form-check form-switch" style="justify-content:space-between;">
                    <div>
                        <input type="checkbox" class="form-check-input">
                        <label for="remember">Remember me</label>
                    </div>

                    <a href="forgot1.html">Forgot Password?</a>
                </div>

                <button type="submit" class="btn"><i class="fa fa-sign-in mx-1"></i>Login</button>

            </form>

            <p class="login">
                Don't have an account? <a href="create.html">Create Account</a>
            </p>

        </div>

    </main>

    <footer class="footer">
        <p>© 2026 Legacy Pensions. All Rights Reserved. | Privacy Policy | Terms of Service</p>
    </footer>   



    <script src="JS/bootstrap.bundle.min.js"></script>

</body>
</html>
